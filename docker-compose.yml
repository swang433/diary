services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: diary_db
      POSTGRES_USER: ${DB_USERNAME:-diary_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - diary-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-diary_user} -d diary_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/diary_db
      DB_USERNAME: ${DB_USERNAME:-diary_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-changeme}
    ports:
      - "8080:8080"

volumes:
  diary-pgdata: